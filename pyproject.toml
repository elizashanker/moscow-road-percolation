[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moscow-road-percolation"
version = "0.1.0"
description = "Reproducible experiments on Moscow district road-network fragmentation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["networkx>=3.4,<4"]

[project.optional-dependencies]
geo = ["osmnx>=2.0,<3", "matplotlib>=3.9,<4", "pandas>=2.2,<4"]
notebooks = ["jupyterlab>=4,<5"]

[tool.setuptools.packages.find]
where = ["src"]
